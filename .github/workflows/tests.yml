name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dashboard dependencies
        run: python -m pip install -r requirements-dashboard.txt

      - name: Run tests
        run: python -m pytest -p no:cacheprovider

      - name: Compile core modules
        run: |
          python -m py_compile \
            src/run_week3_pipeline.py \
            src/week3_benchmark/run_week3_eval.py \
            src/week3_benchmark/build_week3_dashboard.py \
            src/week3_benchmark/run_pairwise_llm_judge.py
